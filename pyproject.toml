[project]
name = "podsum"
version = "0.1.0"
description = "Transcribe Russian IT podcasts and turn them into a short TL;DR plus a deep structured summary."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.28,<1.0",
    "typer>=0.15,<1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
# Local (on-premise) transcription with Whisper. Heavy: pulls CTranslate2 + model weights.
local = ["faster-whisper>=1.1,<2.0"]
# Russian-first CPU transcription via GigaAM v3 RNN-T.
gigaam = ["gigastt>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
podsum = "podsum.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["podsum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Real-inference tests download model weights, so they are opt-in: `pytest -m slow`.
addopts = "-q -m 'not slow'"
markers = [
    "slow: downloads model weights and runs real inference; select with '-m slow'",
]
